<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/iniciaSesion.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container-fluid">
        <div class="row">
          <!-- Formulario -->
          <div class="col-lg-6 col-md-6 col-sm-12 form-container px-5">
            <div class="w-50">
              <h2 class="form-title mb-4">¡Registrate gratis!</h2>
              <form>
                <!-- Nombre (solo para registro) -->
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre">
                </div>
                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo">
                </div>
                <!-- Contraseña -->
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña">
                </div>
                <!-- Botón de acción -->
                <div class="d-flex justify-content-between">
                  <a href="./registro.html"><button type="submit" class="btn btn-primary w-45">Registrarse</button></a>
                  <a href="/index.html"><button type="button" class="btn btn-secondary w-45">Iniciar Sesión</button></a>
                </div>
              </form>
            </div>
          </div>
          <!-- Imagen -->
          <div class="col-lg-6 col-md-6 col-sm-12 image-container">
          </div>
        </div>
      </div>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
