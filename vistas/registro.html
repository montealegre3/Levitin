<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levitin</title>
    <link rel="icon" type="image/x-icon" href="../../assets/logo.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <a href="../index.html" class="btn btn-light back-button">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

  <div class="container">
    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="contenedor">
          <form id="formulario1" action="#">
              <h2 class="fs-1">¡Regístrate gratis!</h2>

              <div class="input-contenedor">
                  <i class="fa-solid fa-user"></i>
                  <input id="userName" type="text" placeholder="Usuario" required>
              </div>

              <div class="input-contenedor">
                  <i class="fa-solid fa-envelope"></i>
                  <input id="email" type="email" placeholder="Correo electrónico" required>
              </div>

              <div class="input-contenedor">
                  <i class="fa-solid fa-lock"></i>
                  <input id="password" type="password" placeholder="Contraseña" required>
              </div>

              <button type="submit">Registrarse</button>
          </form>

          <div class="registrar">
              <p>¿Ya tienes una cuenta? <a href="./iniciaSesion.html">Inicia Sesión</a></p>
          </div>
      </div>
    </div>
  </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
