<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Certificado</title>
  <link rel="icon" type="image/x-icon" href="../../assets/logo.ico">
  <link rel="stylesheet" href="../css/certificado.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container">
    <div id="areaCertificado" class="certificado p-5 border shadow position-relative">
      <div class="contenido-certificado text-center position-relative">
        <h2 id="nombreCertificado" class="fs-2 nombre-certificado"></h2>
        <p><strong></strong> <span id="fechaCertificado"></span></p>
      </div>
    </div>
  </div>
 
  <!-- Botón de descarga -->
  <div class="text-center mt-4">
    <button class="btn1" id="btnDescargarPDF">Descargar en PDF</button>
  </div>

  <!-- Modal para nombre -->
  <div id="modalNombre" class="modal">
    <div class="modal-content text-center p-4">
      <h4>Escribe tu nombre para el certificado</h4>
      <input type="text" id="inputNombre" class="form-control my-3" placeholder="Tu nombre completo" required>
      <button class="btn1" id="btnGenerarCertificado">Generar Certificado</button>
    </div>
  </div>

  <script src="../js/certificado.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</body>
</html>
