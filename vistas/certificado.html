<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Certificado</title>
  <link rel="icon" type="image/x-icon" href="../../assets/logo.ico">
  <link rel="stylesheet" href="../css/certificado.css">
</head>
<body>
  <div class="container mt-5 text-center">
    <h2 class="mb-4">¡Felicidades! 🏆</h2>
    <p>Haz completado todos los formularios y puedes obtener tu certificado</p>
    
    <!-- Botón para abrir el modal -->
    <button class="btn1 mt-4" id="btnAbrirModal">Ingresar nombre para certificado</button>

    <!-- Certificado oculto al inicio -->
    <div id="certificadoFinal" class="mt-5 d-none">
      <div id="areaCertificado" class="certificado p-4 border shadow">
        <h2>Certificado de Participación</h2>
        <p>Otorgado a:</p>
        <h3 id="nombreCertificado" class="text-primary"></h3>
        <p>Por completar satisfactoriamente todos los módulos y formularios del curso.</p>
        <p><strong>Fecha:</strong> <span id="fechaCertificado"></span></p>
      </div>
      <button class="btn1 mt-4" id="btnDescargarPDF">Descargar en PDF</button>
    </div>
  </div>

  <!-- Modal para nombre -->
  <div id="modalNombre" class="modal" style="display: none;">
    <div class="modal-content text-center p-4">
      <h4>Escribe tu nombre para el certificado</h4>
      <input type="text" id="inputNombre" class="form-control my-3" placeholder="Tu nombre completo" required>
      <button class="btn1" id="btnGenerarCertificado">Generar Certificado</button>
    </div>
  </div>

  <script src="../js/certificado.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</body>
</html>
